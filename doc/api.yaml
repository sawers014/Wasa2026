openapi: 3.0.3
info:
  title: WASATextPlus API
  description: 
    API for WASATextPlus. users can log in, chat, send text/photo/file
    messages, react, create groups, and upload files with S3 URLs.
  version: "1.0"
tags:
  - name: login
    description: Login and registration.
  - name: users
    description: Manage the authenticated user's profile.
  - name: uploads
    description: Request file upload URLs.
  - name: files
    description: Retrieve file download URLs.
  - name: conversations
    description: Create and retrieve conversations.
  - name: messages
    description: Send, forward, and delete messages.
  - name: reactions
    description: Add and remove message reactions.
  - name: groups
    description: Create and manage groups.
security:
  - bearerAuth: [] #security rimane costante con wasatext
paths:
  /session:
    post:
      tags:
        - login
      summary: Log in or register
      description: 
        if username exists, log in. otherwise create the user.
        return an id that is the Bearer token.
      operationId: doLogin
      security: []
      requestBody:
        description: User details
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid username


  /users/me/name:
    put:
      tags:
        - users
      summary: Change my username
      description: 
        update the authenticated user name.
        the new name must not be taken by another user.
      operationId: setMyUserName
      requestBody:
        description: New username
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserNameRequest"
      responses:
        "200":
          description: Username updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid username
        "409":
          description: Username already in use

  /users/me/photo:
    put:
      tags:
        - users
      summary: Change my profile photo
      description: 
        set a new profile photo. the file must  be already uploaded
        via createUpload. 
      operationId: setMyPhoto
      requestBody: # differenza con wasaText
        description: New profile photo file ID
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPhotoRequest"
      responses:
        "204":
          description: Photo updated
        "400":
          description: invalid photo or file not found
        "401":
          description: No authorization

  /uploads:
    post:
      tags:
        - uploads
      summary: Get a presigned upload URL
      description: #ulteriore differenza con wastext
        ask for permission to upload a file. return a file ID and a
        S3 URL. The frontend uploads the file directly to S3.
        The URL has the declared size, and files larger than
        the 100 Mb are rejected.
      operationId: createUpload
      requestBody:
        description: File info
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "201":
          description: Upload URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadResponse"
        "400":
          description: invalid request or file too large
        "401":
          description: No authorization

  /files/{fileId}:
    parameters:
      - name: fileId
        in: path
        required: true
        description: File ID
        schema:
          type: string
          description: Unique file identifier.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
    get:
      tags:
        - files
      summary: Get a presigned download URL
      description: 
        Returns a presigned URL to download the file.
        The user must be allowed to see the file.
      operationId: getFile
      responses:
        "200":
          description: Download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDownloadResponse"
        "401":
          description: No authorization
        "404":
          description: File not found

  /conversations:
    get:
      tags:
        - conversations
      summary: List my conversations
      description: 
        returns the user conversations in reverse chronological order.
        each item shows the name/photo, last message time, and a preview.
      operationId: getMyConversations
      responses:
        "200":
          description: List of conversation summaries
          content:
            application/json:
              schema:
                type: array
                description: Conversations ordered from newest to oldest activity.
                minItems: 0
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/ConversationSummary"
        "401":
          description: No authorization
    post:
      tags:
        - conversations
      summary: Start a direct conversation
      description: 
        Start a conversation with another user.
      operationId: createConversation
      requestBody:
        description: Other user
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Invalid request
        "401":
          description: No authorization
        "404":
          description: User not found

  /conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        description: Conversation ID
        schema:
          type: string
          description: Unique conversation identifier.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
    get:
      tags:
        - conversations
      summary: Get conversation details
      description: 
        returns all messages in reverse chronological order.
        Each message includes timestamp, content, sender, status, and reactions.
      operationId: getConversation
      responses:
        "200":
          description: Conversation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          description: No authorization
        "404":
          description: Conversation not found

  /conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        description: Conversation ID
        schema:
          type: string
          description: Unique conversation identifier.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
    post:
      tags:
        - messages
      summary: Send a message
      description: 
        send a text, photo, or file message. For photo/file, the file must
        already be uploaded via createUpload. Use replyToMessageId to reply.
      operationId: sendMessage
      requestBody:
        description: Message to send
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid message or file not found
        "401":
          description: No authorization
        "404":
          description: Conversation or replied message not found

  /messages/{messageId}/forward:
    parameters:
      - name: messageId
        in: path
        required: true
        description: Message ID to forward
        schema:
          type: string
          description: Unique message identifier.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
    post:
      tags:
        - messages
      summary: Forward a message
      description:  #i file sono "puntati" e non copiati
        Forward a message to another conversation. Files are not copied!!
        the new message points to the same file ID.
      operationId: forwardMessage
      requestBody:
        description: Destination conversation
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardMessageRequest"
      responses:
        "201":
          description: Message forwarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid request
        "401":
          description: No authorization
        "404":
          description: msg or conversation not found

  /messages/{messageId}/comments:
    parameters:
      - name: messageId
        in: path
        required: true
        description: Message ID
        schema:
          type: string
          description: Unique message identifier.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
    post:
      tags:
        - reactions
      summary: React to a message
      description: 
        add an emoji reaction to a message.
      operationId: commentMessage
      requestBody:
        description: Reaction
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentMessageRequest"
      responses:
        "201":
          description: Reaction added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reaction"
        "400":
          description: Invalid reaction
        "401":
          description: No authorization
        "404":
          description: Message not found

  /messages/{messageId}/comments/{commentId}:
    parameters:
      - name: messageId
        in: path
        required: true
        description: Message ID
        schema:
          type: string
          description: Unique message identifier.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
      - name: commentId
        in: path
        required: true
        description: Reaction ID
        schema:
          type: string
          description: Unique reaction identifier.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
    delete:
      tags:
        - reactions
      summary: Remove a reaction
      description: 
        Delete one of the authenticated user's reactions.
      operationId: uncommentMessage
      responses:
        "204":
          description: Reaction removed
        "401":
          description: No authorization
        "404":
          description: Message or reaction not found

  /messages/{messageId}:
    parameters:
      - name: messageId
        in: path
        required: true
        description: Message ID
        schema:
          type: string
          description: Unique message identifier.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
    delete:
      tags:
        - messages
      summary: Delete a sent message
      description: 
        Delete a message sent by the user.
      operationId: deleteMessage
      responses:
        "204":
          description: Message deleted
        "401":
          description: No authorization
        "404":
          description: Message not found

  /groups:
    post:
      tags:
        - groups
      summary: Create a group
      description: 
        Create a new group with one or more other users.
      operationId: createGroup
      requestBody:
        description: Group details
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          description: Invalid group data
        "401":
          description: No authorization

  /groups/{groupId}/members:
    parameters:
      - name: groupId
        in: path
        required: true
        description: Group ID
        schema:
          type: string
          description: Unique group identifier.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
    post:
      tags:
        - groups
      summary: Add a user to a group
      description: 
        add another user to the group.
      operationId: addToGroup
      requestBody:
        description: User to add
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToGroupRequest"
      responses:
        "204":
          description: User added
        "400":
          description: Invalid request
        "401":
          description: No authorization
        "404":
          description: Group or user not found

  /groups/{groupId}/members/me:
    parameters:
      - name: groupId
        in: path
        required: true
        description: Group ID
        schema:
          type: string
          description: Unique group identifier.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
    delete:
      tags:
        - groups
      summary: Leave a group
      description: 
        Leave the group.
      operationId: leaveGroup
      responses:
        "204":
          description: Left group
        "401":
          description: No authorization
        "404":
          description: Group not found

  /groups/{groupId}/name:
    parameters:
      - name: groupId
        in: path
        required: true
        description: Group ID
        schema:
          type: string
          description: Unique group identifier.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
    put:
      tags:
        - groups
      summary: Change group name
      description: 
        Update the group name.
      operationId: setGroupName
      requestBody:
        description: New name
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetGroupNameRequest"
      responses:
        "204":
          description: Name updated
        "400":
          description: Invalid name
        "401":
          description: No authorization
        "404":
          description: Group not found

  /groups/{groupId}/photo:
    parameters:
      - name: groupId
        in: path
        required: true
        description: Group ID
        schema:
          type: string
          description: Unique group identifier.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
    put:
      tags:
        - groups
      summary: Change group photo
      description: 
        Set a new group photo. The file must already be uploaded
        via createUpload.
      operationId: setGroupPhoto
      requestBody:
        description: New group photo file ID
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPhotoRequest"
      responses:
        "204":
          description: Photo updated
        "400":
          description: invalid photo or file not found
        "401":
          description: No authorization
        "404":
          description: Group not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Use the id from doLogin as the Bearer token.
  schemas:
    LoginRequest:
      type: object
      description: Credentials used to log in or create an account.
      required:
        - name
      properties:
        name:
          type: string
          description: Username to authenticate or register.
          example: GiovanniGiorgio
          pattern: '^.{3,16}$'
          minLength: 3
          maxLength: 16

    LoginResponse:
      type: object
      description: Identifier to use as the bearer token.
      properties:
        identifier:
          type: string
          description: Unique user identifier and authentication token.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
          example: "21321231"

    User:
      type: object
      description: Public profile information for a user.
      properties:
        identifier:
          type: string
          description: Unique user identifier.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
          example: "asdsadsad"
        name:
          type: string
          description: Username.
          pattern: '^.{3,16}$'
          minLength: 3
          maxLength: 16
          example: Kafka
        photoUrl:
          type: string
          description: Presigned URL for the profile photo.
          pattern: '^https?://.+$'
          minLength: 9
          maxLength: 4096
          example: "https://x.com/bucket/asdsad-"
  # i file sono divisi in bucket
    SetUserNameRequest:
      type: object
      description: Request to change the authenticated user's username.
      required:
        - name
      properties:
        name:
          type: string
          description: New username.
          pattern: '^.{3,16}$'
          minLength: 3
          maxLength: 16
          example: Sas

    SetPhotoRequest:
      type: object
      description: Request to set a profile or group photo.
      required:
        - fileId
      properties:
        fileId:
          type: string
          description: File ID from createUpload. Must exist in S3.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128

    FileUploadRequest:
      type: object
      description: File metadata used to request a presigned upload URL.
      required:
        - fileName
        - contentType
        - size
      properties:
        fileName:
          type: string
          description: Name of the file being uploaded.
          pattern: '^.{1,255}$'
          minLength: 1
          maxLength: 255
          example: "report.pdf"
        contentType:
          type: string
          description: MIME type of the file being uploaded.
          pattern: '^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+$'
          minLength: 3
          maxLength: 127
          example: "application/pdf"
        size:
          type: integer
          format: int64
          description: size in bytes. Must not exceed 100mb.
          minimum: 1
          maximum: 104857600
          example: 1048576
    # 100mb
    FileUploadResponse:
      type: object
      description: File identifier and presigned URL used for uploading.
      properties:
        fileId:
          type: string
          description: Identifier assigned to the uploaded file.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
          example: "3f2-cd12"
        uploadUrl:
          type: string
          description: Presigned S3 PUT URL. Signed with the declared size.
          pattern: '^https?://.+$'
          minLength: 9
          maxLength: 4096
          example: "https://s3.com/bucket/das-as."

    FileDownloadResponse:
      type: object
      description: Presigned URL used to download a file.
      properties:
        downloadUrl:
          type: string
          description: Short-lived presigned S3 GET URL.
          pattern: '^https?://.+$'
          minLength: 9
          maxLength: 4096
          example: "https://s3.com/bucket/dssd1-a23s."

    FileMetadata:
      type: object
      description: Metadata associated with an uploaded file.
      properties:
        fileId:
          type: string
          description: Unique file identifier.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
        fileName:
          type: string
          description: Original name of the file.
          pattern: '^.{1,255}$'
          minLength: 1
          maxLength: 255
          example: "report.pdf"
        contentType:
          type: string
          description: MIME type of the file.
          pattern: '^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+$'
          minLength: 3
          maxLength: 127
          example: "application/pdf"
        size:
          type: integer
          format: int64
          description: File size in bytes.
          minimum: 1
          maximum: 104857600
          example: 321213
        downloadUrl:
          type: string
          description: presigned download URL, if user is allowed.
          pattern: '^https?://.+$'
          minLength: 9
          maxLength: 4096
          example: "https://s3.com/bucket/dssd1-a23s."

    CreateConversationRequest:
      type: object
      description: Request to start a direct conversation.
      required:
        - otherUserIdentifier
      properties:
        otherUserIdentifier:
          type: string
          description: Identifier of the other participant.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
          example: "sdasdasadas"

    ConversationSummary:
      type: object
      description: Conversation details and a preview of its latest message.
      properties:
        id:
          type: string
          description: Unique conversation identifier.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
        type:
          type: string
          description: Whether this is a direct or group conversation.
          pattern: '^(direct|group)$'
          minLength: 5
          maxLength: 6
          enum:
            - direct
            - group
        name:
          type: string
          description: username for direct, group name for groups.
          pattern: '^.{1,64}$'
          minLength: 1
          maxLength: 64
        photoUrl:
          type: string
          description: Presigned URL for the conversation photo.
          pattern: '^https?://.+$'
          minLength: 9
          maxLength: 4096
        lastMessageAt:
          type: string
          description: Timestamp of the latest message.
          format: date-time
          pattern: '^.{1,64}$'
          minLength: 1
          maxLength: 64
        lastMessagePreview:
          type: string
          description: Text snippet for text messages, empty for photo/file.
          pattern: '^[\s\S]{0,256}$'
          minLength: 0
          maxLength: 256
        lastMessageType:
          type: string
          description: Type of the latest message.
          pattern: '^(text|photo|file)$'
          minLength: 4
          maxLength: 5
          enum:
            - text
            - photo
            - file


    Conversation:
      type: object
      description: Full conversation details, including participants and messages.
      properties:
        id:
          type: string
          description: Unique conversation identifier.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
        type:
          type: string
          description: Whether this is a direct or group conversation.
          pattern: '^(direct|group)$'
          minLength: 5
          maxLength: 6
          enum:
            - direct
            - group
        name:
          type: string
          description: Username for direct conversations or group name.
          pattern: '^.{1,64}$'
          minLength: 1
          maxLength: 64
        photoUrl:
          type: string
          description: Presigned URL for the conversation photo.
          pattern: '^https?://.+$'
          minLength: 9
          maxLength: 4096
        members:
          type: array
          description: Users who are members of the conversation.
          minItems: 0
          maxItems: 100
          items:
            $ref: "#/components/schemas/User"
        messages:
          type: array
          description: Messages in the conversation.
          minItems: 0
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Message"
    Message:
      type: object
      description: A message in a conversation.
      properties:
        id:
          type: string
          description: Unique message identifier.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
        conversationId:
          type: string
          description: Identifier of the conversation containing this message.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
        sender:
          description: User who sent the message.
          $ref: "#/components/schemas/User"
        timestamp:
          type: string
          description: Time the message was sent.
          format: date-time
          pattern: '^.{1,64}$'
          minLength: 1
          maxLength: 64
        type:
          type: string
          description: Message content type.
          pattern: '^(text|photo|file)$'
          minLength: 4
          maxLength: 5
          enum:
            - text
            - photo
            - file
        content:
          type: string
          description: Text for text messages. 
          pattern: '^[\s\S]{0,4096}$'
          minLength: 0
          maxLength: 4096
        file:
          description: File metadata for photo or file messages.
          $ref: "#/components/schemas/FileMetadata"
        replyToMessageId:
          type: string
          description: Identifier of the message being replied to, when applicable.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
        forwardedFromMessageId:
          type: string
          description: Identifier of the original message, when this message was forwarded.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
        status:
          type: string
          description: Delivery status of the message.
          pattern: '^(sent|delivered|read)$'
          minLength: 4
          maxLength: 9
          enum:
            - sent
            - delivered
            - read
        reactions:
          type: array
          description: Reactions added to the message.
          minItems: 0
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Reaction"

    Reaction:
      type: object
      description: An emoji reaction to a message.
      properties:
        id:
          type: string
          description: Unique reaction identifier.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
        messageId:
          type: string
          description: Identifier of the message being reacted to.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
        user:
          description: User who added the reaction.
          $ref: "#/components/schemas/User"
        emoji:
          type: string
          description: Emoji used for the reaction.
          pattern: '^.{1,16}$'
          minLength: 1
          maxLength: 16
          example: "👍" # levati i codici Unicode (tanto sono poco utili)

    SendMessageRequest:
      type: object
      description: Request to send a text, photo, or file message.
      required:
        - type
      properties:
        type:
          type: string
          description: Type of message to send.
          pattern: '^(text|photo|file)$'
          minLength: 4
          maxLength: 5
          enum:
            - text
            - photo
            - file
        content:
          type: string
          description:  required for text. optional caption for photo/file.
          pattern: '^[\s\S]{0,4096}$'
          minLength: 0
          maxLength: 4096
        fileId:
          type: string
          description: Required for photo/file. Must exist in S3.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
        replyToMessageId:
          type: string
          description: Identifier of the message being replied to, when applicable.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128

    ForwardMessageRequest:
      type: object
      description: Request to forward a message to another conversation.
      required:
        - targetConversationId
      properties:
        targetConversationId:
          type: string
          description: Identifier of the destination conversation.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128

    CommentMessageRequest:
      type: object
      description: Request to add an emoji reaction to a message.
      required:
        - emoji
      properties:
        emoji:
          type: string
          description: Emoji to add as a reaction.
          pattern: '^.{1,16}$'
          minLength: 1
          maxLength: 16
          example: "❤️" ###

    CreateGroupRequest:
      type: object
      description: Request to create a group with its initial members.
      required:
        - name
        - memberIdentifiers
      properties:
        name:
          type: string
          description: Name of the new group.
          pattern: '^.{1,64}$'
          minLength: 1
          maxLength: 64
        memberIdentifiers:
          type: array
          description: Identifiers of the users to add to the group.
          minItems: 1
          maxItems: 100
          items:
            type: string
            description: Identifier of a user to add.
            pattern: '^.{1,128}$'
            minLength: 1
            maxLength: 128


    Group:
      type: object
      description: Group conversation and its members.
      properties:
        id:
          type: string
          description: Unique group identifier.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128
        name:
          type: string
          description: Name of the group.
          pattern: '^.{1,64}$'
          minLength: 1
          maxLength: 64
        photoUrl:
          type: string
          description: presigned URL for the group photo.
          pattern: '^https?://.+$'
          minLength: 9
          maxLength: 4096
        members:
          type: array
          description: Users who are members of the group.
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/User"

    AddToGroupRequest:
      type: object
      description: Request to add a user to a group.
      required:
        - identifier
      properties:
        identifier:
          type: string
          description: User ID to add.
          pattern: '^.{1,128}$'
          minLength: 1
          maxLength: 128

    SetGroupNameRequest:
      type: object
      description: Request to change a group's name.
      required:
        - name
      properties:
        name:
          type: string
          description: New group name.
          pattern: '^.{1,64}$'
          minLength: 1
          maxLength: 64